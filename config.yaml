# ============================================================================
#  ADVANCE B2B GMS — CONFIGURATION
#  One file drives a job. Keep secrets out of VCS; use ${VAR} for .env values.
# ============================================================================

job:
  client_name: campaign
  output_dir: output
  output_filename: ""          # empty = derived from client_name
  default_country: US
  max_results_per_query: 0     # 0 = unlimited
  max_total_results: 0         # 0 = unlimited

queries:
  - "plumbers in Houston, TX"
  - "dentists in Dallas, TX"

maps:
  headless: true               # false + vnc.display -> visible browser via VNC
  hl: "en"
  gl: "us"
  zoom: 16                     # 0-21; higher = more results per city, slower
  max_results_per_query: 0
  max_total_results: 0
  scroll_pause_seconds: 2.0
  max_scrolls: 0               # 0 = scroll until no new results
  include_permanently_closed: false
  browser_restart_after_queries: 5
  scroll_delay_min_ms: 800
  scroll_delay_max_ms: 1600
  page_navigation_timeout_ms: 30000
  # --- SPEED (see docs/PERFORMANCE.md) --------------------------------------
  workers: 2                   # 1 = old single-page serial discovery.
                               # 2-3 = parallel per-listing extraction with
                               # isolated browser contexts (feed discovery
                               # itself stays serial for correctness). On a
                               # bot challenge everything falls back to 1.
  extract_owner_posts: false   # true = restore the ~3s/listing deep scroll
                               # for has_recent_post / latest_post_date.

reviews:
  enabled: true
  per_business: 5
  min_len: 0
  max_len: 1000

website:
  require_website: false
  enable_playwright_fallback: true
  enable_sitemap: true
  max_pages_per_site: 3
  overall_site_timeout_seconds: 120
  http_connect_timeout_seconds: 10
  http_read_timeout_seconds: 20
  http_retries: 1              # extra attempts for TRANSIENT failures only
                               # (429/503, timeouts, connection errors) with
                               # exponential backoff + jitter
  retry_backoff_base_seconds: 1.0
  retry_backoff_cap_seconds: 20.0
  page_navigation_timeout_seconds: 30
  use_wappalyzer: true

email:
  enabled: true
  max_email_length: 120
  enable_mx_check: false

smtp:
  enabled: false
  workers: 3
  retries: 1
  connection_timeout_seconds: 10
  verification_timeout_seconds: 20
  from_email: verify@example.com

enrichment:
  emails: true
  social: true
  tech_detect: true
  decision_makers: false       # extract from fetched about/team pages (off by default)
  mx_verify: false             # Native MX via dnspython (off by default)
  smtp_verify: false           # Native SMTP via smtplib (off by default)
  require_website: false

# --- AI personalized pitch-hook (OPTIONAL, backward-compatible) -----------
#  When `enabled: true` AND an API key is present in `.env`, the engine sends
#  the full business context to the LLM to generate a personalized hook.
#  No key / disabled / LLM failure -> the rule-based hook is used unchanged.
ai_hook:
  enabled: false
  provider: openai             # "openai" | "deepseek"
  model: ""                    # empty = provider default
  api_key_env: ""              # empty = OPENAI_API_KEY / DEEPSEEK_API_KEY
  timeout_seconds: 30
  max_calls: 0                 # 0 = unlimited; caps per-run LLM spend
  retries: 2

concurrency:
  # --- Continuous producer/consumer enrichment pool --------------------------
  # Maps discovery streams records into a bounded queue; website_workers
  # long-lived threads consume them continuously (the pool is created ONCE
  # per run — no per-batch executors, no batch drain waits).
  website_workers: 20          # global HTTP enrichment workers (1-32); the
                               # global cap for ALL website traffic
  per_domain_concurrency: 1    # max simultaneous requests PER TARGET DOMAIN.
                               # 1 = polite default: aggregate throughput
                               # stays high (20 workers across 20 different
                               # sites) while no single site gets hammered.
  max_in_flight: 0             # bounded queue of prepared records; 0 = auto
                               # (workers x 4). Prevents memory blowup when a
                               # query floods discovery faster than enrichment.
  respect_retry_after: true    # honor a site's Retry-After header (429/503)
                               # with exponential backoff + jitter otherwise.
  playwright_workers: 2        # persistent Chromium browser workers for the
                               # JS-required fallback ONLY. Browsers are
                               # REUSED across sites (lazy-started; no
                               # per-site launch). HTTP stays the primary
                               # path. The Maps collector remains ONE
                               # sequential browser by design (anti-bot
                               # pacing) — this knob does not parallelize Maps.

delays:
  # Maps between-listing pacing. Old conservative default was 2.0-5.0s per
  # listing (a large share of the old ~15s/listing runtime). The engine
  # already auto-backs-off (cooldown + proxy feedback) on a bot challenge.
  # If you see CAPTCHAs often, raise these back to 2.0 / 5.0.
  maps_min_seconds: 0.4
  maps_max_seconds: 1.2
  site_min_seconds: 0.3
  site_max_seconds: 0.8
  cooldown_seconds: 60

# --- VNC: visible browser for manual CAPTCHA solving ----------------------
#  The engine only reads `display` (which X screen the browser draws to).
#  The VIEWER PORT is set in vnc-screen.sh — a NON-COMMON port, NOT 5901/5902.
#  Start the screen with `./vnc-screen.sh`, then connect your TightVNC viewer
#  to the address it prints (your-ip:43873). Do NOT expose a common port.
vnc:
  display: ":2"
  resolution: "1366x900"

# --- Console & logging ----------------------------------------------------
#  The terminal shows ONLY clean progress (which query, how many saved,
#  elapsed time). All warnings/errors go to output/<client>/run.log instead,
#  so a normal run never sprays error-looking lines on screen.
logging:
  level: INFO              # file log detail: DEBUG / INFO / WARNING / ERROR
  quiet: false             # true = hide the progress lines (for cron/tmux)

runtime:
  # Worker counts live under `concurrency:` (above) — the duplicate knobs that
  # used to live here were validated but never read, and have been removed.
  request_timeout: 20.0
  idle_exit_seconds: 0
  pacing: 1.0

grid:
  enabled: false
  cell_size_km: 3.0

geo:
  polygons: []

proxy:
  enabled: false
  urls: []
  pool: []
  file: ""
  rotation: round_robin
  http: ""                     # ${HTTP_PROXY} from .env when ready
  https: ""

analysis:
  enabled: true
  lexicon_hint: ""

# --- Config-driven custom website signals (YES/NO export columns) -----------
#  Each entry scans the fetched website content for the keywords and emits a
#  column named `column` (YES when found). `match: any` = OR across keywords,
#  `match: all` = AND. Conditions on these columns may be used in `filters:`.
signals:
  custom: {}
  #  emergency_service:
  #    column: signal_emergency_service
  #    match: any
  #    keywords: ["24/7", "emergency plumber", "same day service"]
  #  modern_tech:
  #    column: uses_online_booking
  #    match: all
  #    keywords: ["book online", "appointment"]

# --- Per-campaign summary.json (metrics + leads) ----------------------------
#  Written to output/<client_name>/summary.json after every run: peak CPU
#  usage, RAM consumption, elapsed time, full campaign details and every
#  committed lead row.
summary:
  enabled: true
  sample_interval_seconds: 2.0

country:
  default: US

filters:
  include_all: []
  include_any: []
  exclude_all: []
  exclude_any: []
